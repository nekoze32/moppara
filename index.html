<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="もっぱら、食事管理だけ。写真か一言を送るだけで記録できるAIトレーナー。">
<meta name="theme-color" content="#F4F1EC">
<title>Moppara</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moppara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@500&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== 常時見える残量バー ===== -->
<header id="statusbar" class="statusbar" role="button" tabindex="0" aria-label="今日の残量。タップで今日の画面へ">
  <!-- 畳んだときに見える1行。常に置いておき、透明度と位置だけを動かす -->
  <div class="mini" id="sb-mini" aria-hidden="true">
    <span class="mini-label" id="mini-label">残り</span>
    <span class="mini-kcal" id="mini-kcal">—</span><span class="mini-unit" id="mini-unit">kcal</span>
    <span class="mini-pfc" id="mini-pfc"></span>
    <span class="mini-date" id="mini-date"></span>
  </div>
  <div class="hero-wrap"><div class="hero-inner">
  <div class="hero">
    <svg class="ring" viewBox="0 0 96 96" aria-hidden="true">
      <circle class="bgc" cx="48" cy="48" r="40" fill="none" stroke-width="9"/>
      <circle class="fgc" id="sb-ring" cx="48" cy="48" r="40" fill="none" stroke-width="9" stroke-linecap="round"
              stroke-dasharray="0 251.3" transform="rotate(-90 48 48)"/>
      <text class="ring-num" id="sb-pct" x="48" y="46" text-anchor="middle">—</text>
      <text class="ring-cap" x="48" y="60" text-anchor="middle">食べた</text>
    </svg>
    <div class="hero-r">
      <div class="sb-label" id="sb-label">残り</div>
      <div class="sb-remain"><span class="sb-num" id="sb-kcal">—</span><span class="sb-unit" id="sb-unit">kcal</span></div>
      <div class="sb-macros" id="sb-macros"></div>
    </div>
  </div>
  <div class="sb-foot"><span id="sb-date"></span><span id="sb-detail"></span></div>
  </div></div>
</header>

<div class="warnbar" id="warnbar" hidden></div>

<main id="main">

  <!-- ===== 初回のようこそ（APIキーだけ聞く） ===== -->
  <section class="screen" id="screen-welcome" data-screen="welcome" hidden>
    <div class="scroll welcome">
      <img class="w-icon" src="icons/icon-192.png" alt="">
      <h1 class="w-title">Moppara</h1>
      <p class="w-sub">もっぱら、食事管理だけ。</p>
      <ul class="w-points">
        <li>食べたものを<b>写真か一言</b>で送るだけ</li>
        <li>カロリーとPFCを見積もって、<b>残りいくら</b>かを出す</li>
        <li>「今夜どこで何を食べていい？」に<b>品目と個数</b>で答える</li>
      </ul>
      <p class="w-lead">はじめにAPIキーだけ教えてください。<br>身長や目標は、このあとチャットで聞きます。</p>
      <div class="w-choice" id="w-choice"></div>
      <div class="field">
        <input type="password" id="w-key" placeholder="キーを貼り付け" autocomplete="off" spellcheck="false">
        <div class="hint" id="w-hint"></div>
      </div>
      <button class="btn primary w-start" id="w-start">はじめる</button>
      <p class="w-note">キーはこの端末の中だけに保存されます。記録もこの端末から出ません。</p>
    </div>
  </section>

  <!-- ===== チャット ===== -->
  <section class="screen" id="screen-chat" data-screen="chat">
    <div class="chat-log" id="chat-log"></div>
    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="attach-preview" id="attach-preview" hidden>
        <img id="attach-img" alt="送信する写真">
        <button class="attach-x" id="attach-clear" aria-label="写真を外す">×</button>
      </div>
      <div class="composer-row">
        <button type="button" class="icon-btn" id="photo-btn" aria-label="写真を撮る・選ぶ" aria-haspopup="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <!-- 撮る用（capture 付き）と、選ぶ用（capture 無し）の2本。どちらも onPickPhoto が受ける -->
        <input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
        <input type="file" id="photo-input-lib" accept="image/*" hidden>
        <textarea id="chat-input" rows="1" placeholder="写真か、ひとこと"></textarea>
        <button class="send-btn" id="send-btn" aria-label="送信">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.6 21 12 3.4 3.4 3.4 10.2 14 12 3.4 13.8z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ===== 今日 ===== -->
  <section class="screen" id="screen-today" data-screen="today" hidden>
    <div class="scroll" id="today-body"></div>
  </section>

  <!-- ===== 推移 ===== -->
  <section class="screen" id="screen-trend" data-screen="trend" hidden>
    <div class="scroll" id="trend-body"></div>
  </section>

  <!-- ===== 設定 ===== -->
  <section class="screen" id="screen-settings" data-screen="settings" hidden>
    <div class="scroll" id="settings-body"></div>
  </section>

</main>

<nav class="tabbar" id="tabbar">
  <button class="tab is-on" data-go="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>チャット</span></button>
  <button class="tab" data-go="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>今日</span></button>
  <button class="tab" data-go="trend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16l4.5-5 3.5 3 7.5-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>推移</span></button>
  <button class="tab" data-go="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>設定</span></button>
</nav>

<!-- 写真の入口：撮るか選ぶかを、OSのシートに任せず自分で聞く -->
<div class="photo-sheet" id="photo-sheet" hidden>
  <div class="ps-back" id="photo-sheet-back"></div>
  <div class="ps-card" role="dialog" aria-modal="true" aria-label="写真">
    <button type="button" class="ps-item" id="ps-camera">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      写真を撮る
    </button>
    <button type="button" class="ps-item" id="ps-library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17v13h-17z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 15l4.5-4 3.5 3 3-2.5 6 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8.5" cy="9.5" r="1.4" fill="currentColor"/></svg>
      写真を選ぶ
    </button>
    <button type="button" class="ps-cancel" id="ps-cancel">やめる</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
